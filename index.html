<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>英语闯关实验室 · 100 模块 × 10 关 · 金币换车车</title>
<meta name="description" content="儿童英语闯关游戏：100 个模块 × 10 个游戏关卡，1036 个单词；答对赚金币，通关解锁专属交通工具。单文件零依赖，可离线玩。">
<meta name="theme-color" content="#FFB5BA">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="英语闯关">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="英语闯关实验室 · 100 模块 × 10 关">
<meta property="og:description" content="儿童英语闯关游戏：答对赚金币，通关解锁专属交通工具。">
<meta property="og:image" content="icon-512.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --pink:#FFB5BA;--blue:#A8D8F0;--yellow:#FFE5A0;--green:#B8E6C8;--purple:#D5B8E6;
  --pink-deep:#FF8A95;--blue-deep:#6FBCDB;--yellow-deep:#FFC93C;--green-deep:#6FCB8A;--purple-deep:#B083D5;
  --text:#5A4A5A;--text-light:#9A8A9A;
  --glass:rgba(255,255,255,.58);--glass-b:rgba(255,255,255,.8);
  --shadow:0 4px 20px rgba(0,0,0,.07);
  --tap:58px;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  background:linear-gradient(135deg,#FFF0F3 0%,#F0F8FF 25%,#FFFDE8 50%,#F0FFF4 75%,#F5F0FF 100%);
  background-attachment:fixed;color:var(--text);min-height:100vh;
  padding:10px 12px 96px;max-width:760px;margin:0 auto;-webkit-font-smoothing:antialiased;
}
/* ---------- 顶部 ---------- */
.topbar{display:flex;align-items:center;gap:9px;padding:9px 13px;
  background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--glass-b);
  border-radius:18px;box-shadow:var(--shadow);position:sticky;top:8px;z-index:50}
.topbar .logo{font-size:21px;line-height:1}
.topbar .who{flex:1;min-width:0}
.topbar .who b{display:block;font-size:14.5px;letter-spacing:.2px}
.topbar .who span{font-size:11px;color:var(--text-light)}
.pill{display:flex;align-items:center;gap:3px;font-size:13.5px;font-weight:700;
  padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.75)}
.pill.star{color:#C99700}.pill.xp{color:var(--purple-deep)}
.pill.coin{color:#B8860B;background:linear-gradient(135deg,#FFF6DA,#FFE9B0);
  box-shadow:inset 0 0 0 1px rgba(184,134,11,.18)}
.pill.ride{padding:4px 8px;font-size:17px;background:rgba(255,255,255,.75)}
/* 自绘 SVG 载具（坦克 / 装甲车 / 潜水艇…）与 emoji 混排时的尺寸对齐 */
.ridesvg{display:inline-block;line-height:1}
.ridesvg svg{width:1.5em;height:.9em;display:inline-block;vertical-align:-.08em}
.topbar .logo svg{width:30px;height:18px;display:block}
.opt.gone{visibility:hidden}
/* ---------- 课程范围选择器（两级） ---------- */
.scope{position:sticky;top:74px;z-index:49;margin:10px 0 12px;padding:9px 10px;
  background:rgba(255,255,255,.72);backdrop-filter:blur(14px);border:1px solid var(--glass-b);
  border-radius:16px;box-shadow:var(--shadow)}
.scope .lbl{font-size:10.5px;color:var(--text-light);font-weight:700;margin:0 0 7px 3px;
  letter-spacing:.4px}
.scope .chips + .chips{margin-top:7px}
.prog{height:7px;border-radius:999px;background:rgba(0,0,0,.07);overflow:hidden;margin:8px 3px 0}
.prog i{display:block;height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,var(--green-deep),var(--blue-deep));transition:width .45s}
.lb2{font-size:10.5px;font-weight:800;color:var(--purple-deep);margin:7px 3px 7px;letter-spacing:.3px}
.lb2 b{color:var(--text)}
.scope .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.scope .chips::-webkit-scrollbar{display:none}
.schip{flex:0 0 auto;border:none;cursor:pointer;font-family:inherit;font-weight:700;
  font-size:12.5px;color:var(--text);background:#fff;border-radius:999px;
  padding:8px 13px;min-height:36px;box-shadow:0 2px 8px rgba(0,0,0,.06);white-space:nowrap;
  transition:background .15s}
.schip.on{background:linear-gradient(135deg,var(--purple-deep),var(--pink-deep));color:#fff}
.schip i{font-style:normal;opacity:.65;font-size:11px;margin-left:3px}
.schip.mini{font-size:11.5px;padding:7px 11px;min-height:32px;background:rgba(255,255,255,.86)}
.schip.mini.on{background:linear-gradient(135deg,#6FBCDB,#6FCB8A);color:#fff}
.schip.mini b{font-weight:800;margin-right:3px}
/* 未解锁：变灰、不可点（点了会提示先过前一关） */
.schip.lock{background:rgba(255,255,255,.5);color:#B3A8B3;box-shadow:none;cursor:default}
.schip.lock.mini{background:rgba(255,255,255,.45)}
/* ---------- 说明条 ---------- */
.note{font-size:11.5px;line-height:1.65;color:var(--text-light);background:rgba(255,255,255,.5);
  border:1px dashed rgba(0,0,0,.09);border-radius:14px;padding:9px 12px;margin-bottom:13px}
.note b{color:var(--text)}
/* ---------- 卡片 ---------- */
.card{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--glass-b);
  border-radius:22px;box-shadow:var(--shadow);padding:18px;margin-bottom:13px}
h2{font-size:19px;margin-bottom:4px}
h3{font-size:14px;margin:16px 0 8px}
.sub{font-size:12.5px;color:var(--text-light);margin-bottom:14px;line-height:1.6}
.btn{border:none;cursor:pointer;font-family:inherit;font-weight:700;color:#fff;
  border-radius:999px;min-height:var(--tap);padding:0 22px;font-size:15.5px;
  background:linear-gradient(135deg,var(--purple-deep),var(--pink-deep));
  box-shadow:0 6px 16px rgba(176,131,213,.32);transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:#fff;color:var(--text);box-shadow:var(--shadow)}
.btn.sm{min-height:44px;padding:0 17px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
/* ---------- 选项 ---------- */
.prompt{text-align:center;margin:6px 0 14px}
.prompt .big{font-size:52px;line-height:1.1;margin-bottom:6px}
.prompt .q{font-size:14px;color:var(--text-light)}
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.opt{position:relative;cursor:pointer;border:none;font-family:inherit;
  background:#fff;border-radius:20px;box-shadow:var(--shadow);
  min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;transition:transform .12s,box-shadow .2s,outline-color .2s;outline:3px solid transparent}
.opt:active{transform:scale(.96)}
.opt .e{font-size:41px;line-height:1;font-weight:800}
.opt .t{font-size:12px;color:var(--text-light)}
.opt.right{outline-color:var(--green-deep);box-shadow:0 0 0 6px rgba(111,203,138,.22),var(--shadow)}
.opt.wrong{outline-color:var(--pink-deep);animation:shake .4s}
.opt.hint{outline-color:var(--yellow-deep);animation:pulse 1.1s infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,201,60,.5),var(--shadow)}50%{box-shadow:0 0 0 12px rgba(255,201,60,0),var(--shadow)}}
/* ---------- 句子拼图 ---------- */
.answer{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;
  background:rgba(255,255,255,.6);border:2px dashed rgba(176,131,213,.35);border-radius:18px;
  padding:10px;margin-bottom:13px;transition:border-color .2s}
.answer.empty::after{content:'点下面的词卡，按顺序排好句子';font-size:12px;color:var(--text-light)}
.chip{cursor:pointer;border:none;font-family:inherit;font-weight:700;font-size:15px;
  background:#fff;border-radius:14px;padding:11px 14px;box-shadow:var(--shadow);min-height:46px}
.chip:active{transform:scale(.95)}
.pool{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-bottom:13px}
.chip.poolcard{background:linear-gradient(135deg,#fff,#F7F3FF)}
/* ---------- 救小鸟 ---------- */
.bird{font-size:46px;text-align:center;transition:transform .5s,opacity .5s}
.bird.fly{transform:translateY(-70px) scale(1.25);opacity:0}
.hearts{display:flex;gap:5px;justify-content:center;font-size:20px;margin-bottom:6px}
.hearts span.off{filter:grayscale(1);opacity:.3}
.blanks{display:flex;gap:7px;justify-content:center;margin:13px 0;flex-wrap:wrap}
.blank{width:40px;height:50px;border-radius:13px;background:#fff;box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:800;color:var(--purple-deep)}
.blank.on{border:2px dashed rgba(176,131,213,.5);background:rgba(255,255,255,.45)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:6px}
.tile{border:none;cursor:pointer;font-family:inherit;font-weight:800;font-size:21px;color:var(--text);
  background:#fff;border-radius:16px;min-height:var(--tap);box-shadow:var(--shadow)}
.tile:active{transform:scale(.94)}
.tile.no{background:var(--pink);color:#8E3A44;animation:shake .4s}
.tile.gone{visibility:hidden}
/* ---------- 听指令 ---------- */
.actor{font-size:62px;text-align:center;line-height:1.35;transition:transform .25s}
.actor.act{transform:scale(1.22) rotate(-6deg)}
/* ---------- 单词表 ---------- */
.search{width:100%;border:none;font-family:inherit;font-size:14px;color:var(--text);
  background:rgba(255,255,255,.9);border-radius:14px;padding:12px 14px;margin-bottom:10px;
  box-shadow:var(--shadow);outline:2px solid transparent;transition:outline-color .2s}
.search:focus{outline-color:rgba(176,131,213,.5)}
.tablewrap{max-height:66vh;overflow:auto;-webkit-overflow-scrolling:touch}
.lvhdr{font-size:12px;font-weight:800;color:#fff;margin:18px 0 9px;padding:6px 11px;border-radius:999px;
  background:linear-gradient(135deg,var(--purple-deep),var(--pink-deep));display:inline-block}
.lvhdr:first-child{margin-top:0}
.grp{font-size:12.5px;font-weight:800;color:var(--purple-deep);margin:14px 0 7px;
  display:flex;align-items:center;gap:7px}
.grp:first-child{margin-top:0}
.grp .n{font-weight:600;color:var(--text-light);font-size:11px;background:rgba(255,255,255,.8);
  border-radius:999px;padding:2px 8px}
.wrow{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px dashed rgba(0,0,0,.06)}
.wrow .e{font-size:23px;width:36px;text-align:center;flex:0 0 36px;font-weight:800}
.wrow .en{font-weight:800;font-size:14.5px;flex:0 0 auto;min-width:80px}
.wrow .zh{font-size:12.5px;color:var(--text-light);flex:1}
.wrow .say{border:none;cursor:pointer;background:rgba(255,255,255,.9);border-radius:10px;
  width:34px;height:34px;font-size:15px;flex:0 0 34px;box-shadow:var(--shadow)}
.tag{font-size:9.5px;font-weight:800;border-radius:999px;padding:2px 7px;flex:0 0 auto}
.tag.book{background:var(--green);color:#2F6B45}
.tag.draft{background:var(--yellow);color:#8A6A00}
/* ---------- 反馈浮层 ---------- */
.toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%) scale(.8);opacity:0;
  pointer-events:none;background:rgba(255,255,255,.96);border-radius:22px;padding:15px 25px;
  box-shadow:0 10px 34px rgba(0,0,0,.14);font-size:19px;font-weight:800;z-index:99;
  transition:transform .22s cubic-bezier(.34,1.56,.64,1),opacity .22s;white-space:nowrap;max-width:92vw}
.toast.show{transform:translate(-50%,-50%) scale(1);opacity:1}
/* ---------- 闯关进度条 ---------- */
.pbar{height:12px;border-radius:999px;background:rgba(0,0,0,.07);overflow:hidden;margin:10px 0 14px}
.pbar i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--yellow-deep),var(--green-deep),var(--blue-deep));
  transition:width .5s}
.note-lock{font-size:11.5px;line-height:1.65;color:var(--text-light);background:rgba(255,255,255,.55);
  border:1px dashed rgba(0,0,0,.09);border-radius:12px;padding:9px 12px;margin-bottom:11px}
.note-lock b{color:var(--text)}
/* ---------- 通关庆祝 ---------- */
.mask{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.62);backdrop-filter:blur(6px);padding:20px;
  opacity:0;transition:opacity .25s}
.mask.show{opacity:1}
.mask .box{background:#fff;border-radius:26px;box-shadow:0 16px 46px rgba(0,0,0,.16);
  padding:26px 22px;max-width:380px;width:100%;text-align:center;
  transform:scale(.86);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.mask.show .box{transform:scale(1)}
.mask .big{font-size:56px;line-height:1;margin-bottom:6px;animation:pop2 1.1s infinite}
@keyframes pop2{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
.mask .unlock{margin:14px 0 16px;font-size:13.5px;font-weight:800;color:#2F6B45;
  background:var(--green);border-radius:14px;padding:11px 13px;line-height:1.55}
.mask .unlock span{font-weight:600}
.mask .row{justify-content:center}
/* ---------- 底部导航 ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;gap:3px;
  padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.84);backdrop-filter:blur(18px);
  border-top:1px solid rgba(255,255,255,.9);max-width:760px;margin:0 auto}
.tab{flex:1;border:none;background:transparent;cursor:pointer;font-family:inherit;
  border-radius:15px;padding:7px 1px;min-height:56px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;color:var(--text-light);font-size:9.5px;font-weight:700}
.tab .ic{font-size:20px;line-height:1}
.tab.on{background:linear-gradient(135deg,rgba(213,184,230,.5),rgba(255,181,186,.45));color:var(--text)}
/* ---------- 家长小结 ---------- */
.log{font-size:12.5px;line-height:1.9}
.log .l{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed rgba(0,0,0,.07)}
.log .en{font-weight:700}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--green);color:#2F6B45}
.badge.warn{background:var(--yellow);color:#8A6A00}
.empty-hint{text-align:center;font-size:13px;color:var(--text-light);padding:22px 0}
/* ---------- v5：关卡地图 ---------- */
.modhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.modhead .car{font-size:40px;line-height:1;flex:0 0 auto;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.13))}
.modhead .car.locked{filter:grayscale(1) opacity(.42)}
.modhead .txt{flex:1;min-width:0}
.modhead .txt b{display:block;font-size:16px;margin-bottom:2px}
.modhead .txt span{font-size:11.5px;color:var(--text-light);line-height:1.5;display:block}
.stages{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stage{position:relative;cursor:pointer;border:none;font-family:inherit;text-align:left;
  background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:11px 12px;
  display:flex;gap:9px;align-items:center;transition:transform .12s}
.stage:active{transform:scale(.97)}
.stage .no{flex:0 0 auto;width:34px;height:34px;border-radius:11px;display:flex;
  align-items:center;justify-content:center;font-size:16px;font-weight:800;
  background:linear-gradient(135deg,#F3ECFF,#FFF0F3);color:var(--purple-deep)}
.stage .info{flex:1;min-width:0}
.stage .info b{display:block;font-size:12.5px;margin-bottom:2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.stage .info i{font-style:normal;font-size:10.5px;color:var(--text-light)}
.stage .st{font-size:11px;white-space:nowrap;font-weight:800}
.stage.done{background:linear-gradient(135deg,#F2FFF7,#fff)}
.stage.done .no{background:linear-gradient(135deg,var(--green),#DFF6E8);color:#2F6B45}
.stage.doing{background:linear-gradient(135deg,#FFFDF3,#fff);
  box-shadow:0 0 0 3px rgba(255,201,60,.5),var(--shadow)}
.stage.lock{background:rgba(255,255,255,.5);box-shadow:none;cursor:default}
.stage.lock .no{background:rgba(0,0,0,.05);color:#B3A8B3}
.stage.lock .info b,.stage.lock .info i{color:#B3A8B3}
/* ---------- v5：车库 ---------- */
.garage-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.coinbig{font-size:24px;font-weight:800;color:#B8860B}
.gwrap{max-height:70vh;overflow:auto;-webkit-overflow-scrolling:touch;margin-top:10px}
.grid-car{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:11px}
.vcard{position:relative;border:none;cursor:pointer;font-family:inherit;background:#fff;
  border-radius:17px;box-shadow:var(--shadow);padding:11px 7px 9px;text-align:center;
  transition:transform .12s}
.vcard:active{transform:scale(.95)}
.vcard .ic{font-size:34px;line-height:1.15;display:block;filter:drop-shadow(0 3px 5px rgba(0,0,0,.13))}
.vcard .nm{font-size:11.5px;font-weight:800;margin-top:5px;display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcard .pr{font-size:10.5px;font-weight:700;color:#B8860B;margin-top:3px;display:block}
.vcard.lock .ic{filter:grayscale(1) opacity(.32)}
.vcard.lock .nm{color:#B3A8B3}
.vcard.lock .pr{color:#B3A8B3}
.vcard.owned{background:linear-gradient(135deg,#F4FFF8,#fff)}
.vcard.owned .pr{color:#2F6B45}
.vcard.riding{box-shadow:0 0 0 3px var(--yellow-deep),var(--shadow)}
.vcard.riding::after{content:'🚩';position:absolute;top:6px;right:7px;font-size:13px}
.rbadge{position:absolute;top:6px;left:7px;font-size:9px;font-weight:800;border-radius:999px;
  padding:2px 6px;color:#fff}
.r1{background:#A9A2B0}.r2{background:#6FCB8A}.r3{background:#6FBCDB}
.r4{background:#B083D5}.r5{background:#E8A317}
/* ---------- v5：关卡结算 ---------- */
.ses{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:11px;
  background:rgba(255,255,255,.72);border-radius:14px;padding:8px 12px;font-size:12px;font-weight:700}
.ses .b{flex:1;min-width:120px;height:9px;border-radius:999px;background:rgba(0,0,0,.07);overflow:hidden}
.ses .b i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--yellow-deep),var(--green-deep));transition:width .4s}
.stars{font-size:26px;letter-spacing:3px;margin:4px 0 2px}
.stars .off{filter:grayscale(1);opacity:.28}
.coinrow{display:flex;justify-content:center;gap:14px;margin:12px 0 4px;flex-wrap:wrap}
.coinbox{background:linear-gradient(135deg,#FFF8E2,#FFEFC2);border-radius:14px;padding:8px 14px;
  font-size:12.5px;font-weight:800;color:#8A6A00}
.coinbox b{font-size:16px;display:block}
@media(min-width:520px){.options{grid-template-columns:repeat(4,1fr)}.opt{min-height:126px}
  .stages{grid-template-columns:repeat(3,1fr)}}
@media(max-width:360px){.stages{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo" id="logo">🦊</div>
  <div class="who"><b>英语游戏实验室 <span style="font-weight:600;color:#B083D5">v5</span></b><span id="poolInfo">课程词库加载中…</span></div>
  <div class="pill coin">🪙 <span id="pCoins">0</span></div>
  <div class="pill star">⭐ <span id="pStars">0</span></div>
</div>

<div class="scope">
  <div class="lbl" id="scLbl">📚 练习范围 · 加载中…</div>
  <div class="prog"><i id="scBar"></i></div>
  <div class="lb2" id="curLine">闯关目标加载中…</div>
  <div class="chips" id="lvChips"></div>
  <div class="chips" id="modChips"></div>
</div>

<div id="sesBar"></div>
<main id="stage"></main>

/* =========================================================
   课程范围：级别（L1–L5）+ 模块（m1–m100）
   ========================================================= */
let scope = 'all';        /* all | weak | L1..L5 | m1..m100 */
let levelView = 1;        /* 下排模块行正在浏览哪个级别 */

function inScope(item){
  if(scope === 'weak'){
    const e = S.log[item.id];
    return !!e && e.wrong > 0;
  }
  if(!isUnlocked(item.m)) return false;      /* 锁住的模块，不参与任何范围（也不当干扰项） */
  if(scope === 'all') return true;
  if(scope[0] === 'L') return lvlOf(item.m) === Number(scope.slice(1));
  return item.m === Number(scope.slice(1));
}
function poolWords(){ return WORDS.filter(inScope); }
function poolSentences(){ return SENTENCES.filter(inScope); }
function moduleCount(n){ return WORDS.filter(w => w.m === n).length; }
function levelWords(l){ return WORDS.filter(w => lvlOf(w.m) === l).length; }
function levelSentences(l){ return SENTENCES.filter(s => lvlOf(s.m) === l).length; }
function weakCount(){ return Object.values(S.log).filter(v => v.wrong > 0).length; }
function scopeLabel(){
  if(scope === 'all') return '全部已解锁模块';
  if(scope === 'weak') return '只练错过的';
  if(scope[0] === 'L'){ const l = LEVELS.find(x => x.k === Number(scope.slice(1))); return `L${l.k} ${l.name}`; }
  const n = Number(scope.slice(1)); return `M${n} ${modInfo(n).title}`;
}
/* 当前范围内有内容的模块号（单词表用） */
function modulesInScope(){
  if(scope === 'all') return unlockedModules();
  if(scope[0] === 'L'){
    const l = Number(scope.slice(1));
    return MODULES.filter(m => lvlOf(m.n) === l && isUnlocked(m.n)).map(m => m.n);
  }
  if(scope === 'weak'){
    const hit = new Set();
    Object.entries(S.log).forEach(([id,v]) => {
      if(v.wrong <= 0) return;
      const w = WORDS.find(x => x.id === id);
      if(w){ hit.add(w.m); return; }
      const s = SENTENCES.find(x => x.id === id);
      if(s) hit.add(s.m);
    });
    return MODULES.map(m => m.n).filter(n => hit.has(n));
  }
  return [Number(scope.slice(1))];
}

/* =========================================================
   闯关解锁（v4 新增）
   规则：一关一关往前推。
     · M1 默认开启
     · 把当前模块里的【每个】单词都答对至少一次 = 过关
     · 过关后自动解锁下一模块，以及它的新单词
     · 锁住的模块不出题、不当干扰项、不进单词表
   ========================================================= */
/* =========================================================
   闯关解锁（v5：模块 → 10 个关卡）
   · M1 默认开启
   · 每个模块 10 个关卡，一关一种玩法，一关一关往前推
   · 每关 5 题（第 10 关 Boss 8 题），答对得金币，按一次答对率评 1–3 星
   · 10 关全部通过 = 本模块通关 → 解锁下一模块 + 开放本模块专属交通工具
   · 锁住的模块不出题、不当干扰项、不进单词表
   ========================================================= */
const STAGES_PER_MOD = 10, Q_PER_STAGE = 5, Q_BOSS = 8;
const stageKey = (m,s) => m + '-' + s;
function stageRec(m,s){ return S.stages[stageKey(m,s)] || null; }
function stageDone(m,s){ const r = stageRec(m,s); return !!(r && r.done); }
function stageStars(m,s){ const r = stageRec(m,s); return r ? (r.stars|0) : 0; }
function stagesDoneIn(m){ let c = 0; for(let s = 1; s <= STAGES_PER_MOD; s++) if(stageDone(m,s)) c++; return c; }
function moduleStars(m){ let c = 0; for(let s = 1; s <= STAGES_PER_MOD; s++) c += stageStars(m,s); return c; }
function allStars(){ let c = 0; MODULES.forEach(m => { c += moduleStars(m.n); }); return c; }
function isCleared(n){ return stagesDoneIn(n) >= STAGES_PER_MOD; }
function isUnlocked(n){ if(S.free) return true; if(n <= 1) return true; return isCleared(n - 1); }
function levelUnlocked(l){ return MODULES.some(m => lvlOf(m.n) === l && isUnlocked(m.n)); }
function unlockedModules(){ return MODULES.filter(m => isUnlocked(m.n)).map(m => m.n); }
function unlockedWords(){ return WORDS.filter(w => isUnlocked(w.m)); }
function unlockedWordCount(){ return unlockedWords().length; }
function clearedCount(){ return MODULES.filter(m => isCleared(m.n)).length; }
function maxUnlocked(){ let mx = 1; MODULES.forEach(m => { if(isUnlocked(m.n)) mx = m.n; }); return mx; }
/* 关卡开放规则：本模块第 1 关开着，之后每关要前一关通过 */
function stageOpen(m,s){
  if(s < 1 || s > STAGES_PER_MOD) return false;
  if(!isUnlocked(m)) return false;
  if(S.free) return true;
  if(s === 1) return true;
  return stageDone(m, s - 1);
}
/* 本模块下一个该打的关卡（10 关全通则返回 0） */
function nextStageIn(m){ for(let s = 1; s <= STAGES_PER_MOD; s++) if(!stageDone(m,s)) return s; return 0; }
function progressOf(n){ const got = stagesDoneIn(n); return {got, total: STAGES_PER_MOD,
  pct: Math.round(got / STAGES_PER_MOD * 100)}; }
/* 当前关卡 = 第一个还没通关的已解锁模块 */
function currentModule(){
  for(const m of MODULES){ if(isUnlocked(m.n) && !isCleared(m.n)) return m.n; }
  return MODULES[MODULES.length - 1].n;
}
/* 干扰项只从未解锁外的词里挑，免得把还没学的词摆到孩子眼前 */
function distractorPool(){ const u = unlockedWords(); return u.length >= 8 ? u : WORDS; }
/* 出题优先给「本关还没答对过」的词：
   否则随机抽会有大量重复，集齐 9 个词平均要答 25 题，孩子会烦。 */
function pickFresh(pool){
  const fresh = pool.filter(w => !(S.log[w.id] && S.log[w.id].right > 0));
  return pick(fresh.length ? fresh : pool);
}

  try{

    if(!raw) return base;
    const p = JSON.parse(raw);
    if(!p || typeof p !== 'object') return base;
    const rd = p.ride | 0;
    return {stars:p.stars|0, xp:p.xp|0, coins:p.coins|0, log:p.log||{}, scope:p.scope||'',

            garage:(p.garage && typeof p.garage === 'object') ? p.garage : {},
            ride:(rd >= 1 && rd <= 100 && p.garage && p.garage[rd]) ? rd : 0};
  }catch(e){ return base; }
}

let AC = null;
function ac(){
  if(!AC){ const C = window.AudioContext || window.webkitAudioContext; if(C) AC = new C(); }
  if(AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq,dur,when,vol,type){
  const c = ac(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  const t0 = c.currentTime + (when || 0);
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol || .16, t0 + .015);
  g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + .03);
}
function sfxRight(){ tone(784,.13,0,.14); tone(988,.13,.09,.13); tone(1319,.26,.18,.12); }
function sfxTry(){ tone(392,.18,0,.1,'triangle'); tone(330,.26,.12,.09,'triangle'); }
function sfxWin(){ [523,659,784,1047].forEach((f,i)=>tone(f,.22,i*.11,.13)); }

let VOICE = null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return null;
  const list = speechSynthesis.getVoices().filter(v => (v.lang||'').toLowerCase().startsWith('en'));
  if(!list.length) return null;
  const pref = /Samantha|Google US English|Microsoft (Aria|Jenny|Zira|Guy)|Karen|Daniel/i;
  return list.find(v => pref.test(v.name)) || list[0];
}
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = () => { VOICE = pickVoice(); };
  VOICE = pickVoice();
}
function speak(text,rate){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = rate || 0.78; u.pitch = 1.06;
    if(VOICE) u.voice = VOICE;
    speechSynthesis.speak(u);
  }catch(e){}
}

   工具
   ========================================================= */
const $ = sel => document.querySelector(sel);
const rnd = n => Math.floor(Math.random()*n);
const pick = arr => arr[rnd(arr.length)];
function shuffle(a){
  const b = a.slice();
  for(let i=b.length-1;i>0;i--){ const j=rnd(i+1); [b[i],b[j]]=[b[j],b[i]]; }
  return b;
}
/* ⚠️ 关键：按 emoji 去重挑干扰项。
   原始数据里 boy/brother、girl/sister 等曾经共用同一个 emoji，
   如果不去重，听音找图会出现两张一模一样的卡，孩子无法判断。 */
function optionsFor(pool,target,count){
  const seen = new Set([target.emoji]);
  const out = [];
  const rest = shuffle(pool).filter(w => w.id !== target.id);
  for(const w of rest){
    if(out.length >= count) break;
    if(seen.has(w.emoji)) continue;
    seen.add(w.emoji); out.push(w);
  }
  for(const w of rest){                       /* 同 emoji 词太多时兜底 */
    if(out.length >= count) break;
    if(!out.some(o => o.id === w.id)) out.push(w);
  }
  return out;
}
let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 950);
}
const PRAISE = ['太棒了！','你真厉害！','答对啦！','Excellent!','很好！','Great job!'];
const NUDGE  = ['再听一次～','没关系，慢慢来','Try again～','仔细听哦'];

/* 范围提示：只在范围内确实没有内容时才退回「全部」 */
function needPool(kind){
  const p = kind === 'w' ? poolWords() : poolSentences();
  if(p.length) return p;
  toast(scope === 'weak' ? '还没有错过的内容，先玩「全部」吧～' : '这组还没有内容，已切回「全部」');
  setScope('all');
  return kind === 'w' ? poolWords() : poolSentences();
}

const findGame = {target:null,errors:0,locked:false};

function mountFind(root){ findGame.errors = 0; newFindRound(root); }

function newFindRound(root){
  if(SES && SES.done) return;              /* 本关已打完 → 别再出题 */
  const g = findGame;
  g.target = pickFresh(needPool('w'));
  const distractorCount = g.errors >= 3 ? 1 : 3;      /* 连错 3 次 → 降到 2 选 1 */
  /* 干扰项从「已解锁词库」挑（按 emoji 去重）：这样即使当前范围只剩 1 个词，
     也仍然凑得齐 4 张互不相同的图，而且不会把还没解锁的词摆到孩子眼前。 */
  const opts = shuffle([g.target, ...optionsFor(distractorPool(), g.target, distractorCount)]);
  g.locked = false;

  root.innerHTML = `
    <div class="card">
      <h2>🔊 听音找图</h2>

    /* 数字类词（11–20、大数字）glyph 比较长，按长度缩字号，避免撑出卡片 */
    const gl = w.emoji.length;
    b.innerHTML = `<span class="e"${gl > 3 ? ' style="font-size:20px"' : gl > 2 ? ' style="font-size:28px"' : ''}>${w.emoji}</span>`;
    b.dataset.id = w.id;
    b.addEventListener('click', () => answerFind(root, b, w));
    box.appendChild(b);
  });
  root.querySelector('#again').addEventListener('click', () => speak(g.target.en));
  setTimeout(() => speak(g.target.en), 260);

function answerFind(root, btn, w){
  const g = findGame;
  if(g.locked) return;
  const right = w.id === g.target.id;
  if(right){
    g.locked = true;
    btn.classList.add('right');
    sfxRight(); award(true); record(g.target.id, g.target.en, true);
    toast(pick(PRAISE)); speak(g.target.en);
    g.errors = 0;
    setTimeout(() => newFindRound(root), 1150);
  }else{

    speak(g.target.en);

    if(c) c.classList.add('hint');
    toast(pick(NUDGE));
    setTimeout(() => {

      else{ const cc = root.querySelector(`.opt[data-id="${g.target.id}"]`); if(cc) cc.classList.remove('hint'); }
    }, 1400);
  }
}

const birdGame = {word:null,slot:[],tiles:[],feathers:4,locked:false};
const SPELLABLE = () => unlockedWords().filter(w => /^[a-z]+$/.test(w.en) && w.en.length >= 3);

function mountBird(root){ newBirdRound(root); }

function newBirdRound(root){
  if(SES && SES.done) return;
  const g = birdGame;
  const pool = poolWords().filter(w => /^[a-z]+$/.test(w.en) && w.en.length >= 3);
  g.word = pickFresh(pool.length ? pool : SPELLABLE());
  const letters = g.word.en.split('');
  const decoys = 'abcdefghijklmnopqrstuvwxyz'.split('').filter(c => !letters.includes(c));
  g.slot = Array(letters.length).fill('');
  g.feathers = 4;
  g.locked = false;
  g.tiles = shuffle([...letters, ...shuffle(decoys).slice(0, 3)])
    .map((ch,i) => ({ch, id:i, used:false}));
  renderBird(root);
  setTimeout(() => speak(g.word.en), 300);
}

function renderBird(root){
  const g = birdGame;
  const done = !g.slot.includes('') && g.slot.length === g.word.en.length;
  root.innerHTML = `
    <div class="card">
      <h2>🐦 救小鸟</h2>
      <div class="sub">听单词，按顺序点字母。拼对了小鸟就能飞回家！范围：<b>${scopeLabel()}</b>。</div>

      <div class="bird" id="bird">${g.feathers>=3?'🐦':g.feathers===2?'🐤':'🥚'}</div>

      <div class="center" style="margin-bottom:12px">
        <button class="btn ghost sm" id="again">🔊 再听一次</button>
      </div>
      <div class="tiles" id="tiles">
        ${g.tiles.map(t => `<button class="tile ${t.used?'gone':''}" data-id="${t.id}">${t.ch}</button>`).join('')}
      </div>
    </div>`;
  root.querySelector('#again').addEventListener('click', () => speak(g.word.en));
  root.querySelectorAll('#tiles .tile').forEach(b =>
    b.addEventListener('click', () => tapLetter(root, b, Number(b.dataset.id))));
  if(done) finishBird(root);
}

function tapLetter(root, btn, id){
  const g = birdGame;
  if(g.locked || btn.classList.contains('gone')) return;
  const tile = g.tiles.find(t => t.id === id);
  const pos = g.slot.indexOf('');
  if(pos < 0) return;
  if(tile.ch === g.word.en[pos]){
    g.slot[pos] = tile.ch;
    tile.used = true;
    sfxRight();
    renderBird(root);
  }else{
    btn.classList.add('no');
    sfxTry();
    award(false);
    g.feathers--;
    record(g.word.id, g.word.en, false);
    speak(g.word.en);
    if(g.feathers <= 0){
      g.locked = true;
      toast('小鸟有点累了，我们再来一次～');
      setTimeout(() => newBirdRound(root), 1500);
      return;
    }
    setTimeout(() => { btn.classList.remove('no'); renderBird(root); }, 420);
  }
}

function finishBird(root){
  const g = birdGame;
  g.locked = true;
  sfxWin(); award(true); record(g.word.id, g.word.en, true);
  const b = root.querySelector('#bird');
  if(b) b.classList.add('fly');
  toast('🎉 小鸟飞回家啦！' + g.word.en);
  speak(g.word.en);
  setTimeout(() => newBirdRound(root), 2000);
}

  opts.forEach(a => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="e">${a.emoji}</span><span class="t">${a.zh}</span>`;
    b.dataset.i = ACTIONS.indexOf(a);
    b.addEventListener('click', () => answerSimon(root, b, a));
    box.appendChild(b);
  });
  root.querySelector('#again').addEventListener('click', () => speak(g.target.en));
  setTimeout(() => speak(g.target.en), 260);
}

function answerSimon(root, btn, a){
  const g = simonGame;
  if(g.locked) return;
  if(a.en === g.target.en){
    g.locked = true;
    btn.classList.add('right');
    sfxRight(); award(true); record('act:' + g.target.en, g.target.en, true);
    const actor = root.querySelector('#actor');
    actor.textContent = g.target.emoji;
    actor.classList.add('act');
    toast(pick(PRAISE)); speak(g.target.en);
    g.errors = 0;
    setTimeout(() => newSimonRound(root), 1250);
  }else{
    btn.classList.add('wrong');
    sfxTry(); award(false); record('act:' + g.target.en, g.target.en, false);
    g.errors++;
    speak(g.target.en);
    const idx = ACTIONS.indexOf(g.target);
    const c = root.querySelector(`.opt[data-i="${idx}"]`);
    if(c) c.classList.add('hint');
    toast(pick(NUDGE));
    setTimeout(() => {
      if(g.errors >= 3) newSimonRound(root);
      else if(c) c.classList.remove('hint');
    }, 1400);
  }
}

/* =========================================================

   ========================================================= */
const GAMES = [
  {key:'find',  ic:'🔊', name:'听音找图', desc:'听单词，点出对应的图'},
  {key:'pair',  ic:'🃏', name:'记忆配对', desc:'把图和单词配成一对'},
  {key:'bird',  ic:'🐦', name:'救小鸟',   desc:'按顺序点字母，拼出单词'},
  {key:'pick',  ic:'🎯', name:'看图选词', desc:'看图，点出正确的英文'},
  {key:'scram', ic:'🧩', name:'句子拼图', desc:'听句子，把词卡排好顺序'},
  {key:'listen',ic:'🎧', name:'听音选中文', desc:'听单词，点出中文意思'},
  {key:'tpr',   ic:'🕺', name:'听指令',   desc:'听指令，点出那个动作'},
  {key:'sort',  ic:'🔤', name:'字母排序', desc:'把打乱的字母按顺序排好'},
  {key:'mole',  ic:'💥', name:'打地鼠',   desc:'看到目标词就点它'},
  {key:'boss',  ic:'👑', name:'混合挑战', desc:'前面玩过的题型混在一起'}
];
function gameOf(s){ return GAMES[(s - 1) % GAMES.length]; }
/* 有些玩法要「纯字母单词」，数字/符号类模块没有 → 自动降级为「看图选词」 */
function stageSpellPool(m){
  return WORDS.filter(w => w.m === m && /^[a-z]+$/.test(w.en) && w.en.length >= 3);
}
function stageGame(m, s){
  const g = gameOf(s);
  if((g.key === 'bird' || g.key === 'sort') && !stageSpellPool(m).length) return GAMES[3];
  return g;
}
function stageQLimit(s){ return s === STAGES_PER_MOD ? Q_BOSS : Q_PER_STAGE; }

/* =========================================================
   v5：关卡会话（一关打完就结算）
   ========================================================= */
let SES = null;
function startStage(m, s){
  if(!stageOpen(m, s)){ toast(`先通过第 ${s - 1} 关，才能玩这一关哦～`); return false; }
  const g = stageGame(m, s);
  SES = {m, s, key:g.key, gameKey:g.key, g, total:stageQLimit(s), i:0, right:0, wrong:0, coins:0,
         done:false, replay:stageDone(m, s)};
  go('play');
  return true;
}
function paintSession(){
  const bar = document.getElementById('sesBar');
  if(!bar) return;
  if(!SES){ bar.innerHTML = ''; return; }
  const pct = SES.free ? 0 : Math.round(SES.i / SES.total * 100);
  const prog = SES.free ? `已答对 ${SES.i} 题` : `${SES.i}/${SES.total}`;
  bar.innerHTML = `
    <div class="ses">
      <span>${SES.g.ic} ${SES.free ? '自由练习' : `M${SES.m} · 第 ${SES.s}/${STAGES_PER_MOD} 关`}</span>
      <span class="b"><i style="width:${pct}%"></i></span>
      <span>${prog} 🪙 ${SES.coins}</span>
      <button class="btn sm ghost" id="sesQuit"
        style="min-height:32px;padding:0 12px;font-size:12px">退出</button>
    </div>`;
  const q = bar.querySelector('#sesQuit');
  if(q) q.addEventListener('click', () => { SES = null; paintSession(); go('map'); toast('已退出这一关'); });
}
/* 关卡结算 */
function sesFinish(){
  if(!SES || SES.done) return;
  SES.done = true;
  const snap = {m:SES.m, s:SES.s, g:SES.g, total:SES.total, right:SES.right,
                wrong:SES.wrong, coins:SES.coins, replay:SES.replay};
  const stars = snap.wrong === 0 ? 3 : snap.wrong <= 2 ? 2 : 1;
  const key = stageKey(snap.m, snap.s);
  const rec = stageRec(snap.m, snap.s);
  const prevStars = rec ? (rec.stars | 0) : 0;
  const best = Math.max(stars, prevStars);
  S.stages[key] = {done:true, stars:best, plays:((rec && rec.plays) | 0) + 1, at:Date.now()};
  snap.stars = stars;
  snap.newBest = best > prevStars;
  /* 通关奖励：只在第一次通过这一关时给 */
  snap.bonus = 0;
  if(!snap.replay){ snap.bonus = 10 + lvlOf(snap.m) * 2; S.coins += snap.bonus; }
  save();
  snap.justCleared = checkModuleClear(snap.m);
  if(snap.justCleared){ snap.clearBonus = 50 + lvlOf(snap.m) * 15; S.coins += snap.clearBonus; save(); }
  refreshChip(snap.m); paintChips(); paintTop();
  setTimeout(() => sesResult(snap), 850);
}
function sesResult(k){
  sfxWin();
  const nextS = k.s < STAGES_PER_MOD ? k.s + 1 : 0;
  const car = RIDE_BY_N[k.m];
  const carReady = rideUnlocked(k.m) && !rideOwned(k.m);
  showMask(`
      <div class="big">${k.stars === 3 ? '🌟' : k.stars === 2 ? '👏' : '💪'}</div>
      <h2>第 ${k.s} 关通过！</h2>
      <div class="stars">${[0,1,2].map(i => `<span class="${i < k.stars ? '' : 'off'}">⭐</span>`).join('')}</div>
      <div class="sub" style="margin:6px 0 0">${k.g.ic} ${k.g.name} · 共 ${k.total} 题，
        ${k.wrong ? `答错 <b>${k.wrong}</b> 次` : '一路全对'} · 金币 <b>+${k.coins + k.bonus + (k.clearBonus || 0)}</b></div>
      <div class="coinrow">
        <div class="coinbox">本关赚到<b>🪙 ${k.coins + k.bonus + (k.clearBonus || 0)}</b></div>
        <div class="coinbox">金币余额<b>🪙 ${S.coins}</b></div>
        ${k.newBest && k.stars > 0 ? `<div class="coinbox">本关纪录<b>⭐ ${k.stars}</b></div>` : ''}
      </div>
      ${k.coins + k.bonus + (k.clearBonus || 0) > k.coins
        ? `<div class="sub" style="margin:8px 0 0">🎁 含第一次通过的额外奖励${k.clearBonus ? ` + 模块通关大奖 🪙 ${k.clearBonus}` : ''}</div>` : ''}
      ${carReady ? `<div class="unlock">🚗 可兑换本模块座驾：<b>${car.name}</b>（🪙 ${car.price}）</div>` : ''}
      <div class="row">
        ${nextS ? `<button class="btn sm" id="rNext">第 ${nextS} 关 →</button>` : `<button class="btn sm" id="rFinish">完成本模块 →</button>`}
        <button class="btn sm ghost" id="rAgain">再玩一次</button>
        <button class="btn sm ghost" id="rMap">🗺️ 关卡地图</button>
        ${carReady ? `<button class="btn sm ghost" id="rGarage">🚗 去车库</button>` : ''}
      </div>`, (box, close) => {
    box.querySelector('#rAgain').addEventListener('click', () => { close(); startStage(k.m, k.s); });
    box.querySelector('#rMap').addEventListener('click', () => { close(); setScope('m' + k.m); go('map'); });
    const gb = box.querySelector('#rGarage');
    if(gb) gb.addEventListener('click', () => { close(); go('garage'); });
    const nx = box.querySelector('#rNext');
    if(nx) nx.addEventListener('click', () => { close(); startStage(k.m, k.s + 1); });
    const fn = box.querySelector('#rFinish');
    if(fn) fn.addEventListener('click', () => {
      close();
      if(k.justCleared) celebrate(k.m);
      else { setScope('m' + currentModule()); go('map'); }
    });
  });
}

        答对得 🪙 金币，${STAGES_PER_MOD} 关全过就解锁下一模块和这辆座驾。</div>
    </div>

    <div class="card">
      <h2>🗺️ 关卡地图</h2>

          const s = i + 1;

/* 按 emoji 去重，保证配对/选择题里不会出现两张一模一样的图 */
function uniqEmoji(list){
  const seen = new Set(), out = [];
  for(const w of list){ if(seen.has(w.emoji)) continue; seen.add(w.emoji); out.push(w); }
  return out;
}

    renderPair(root);
    setTimeout(() => {

  }
}

const sortGame = {word:null, slot:[], tiles:[], locked:false};
function mountSort(root){ newSortRound(root); }

function newSortRound(root){
  if(SES && SES.done) return;
  const g = sortGame;
  const pool = needPool('w').filter(w => /^[a-z]+$/.test(w.en) && w.en.length >= 3);
  g.word = pickFresh(pool.length ? pool : SPELLABLE());
  g.slot = Array(g.word.en.length).fill('');
  g.tiles = shuffle(g.word.en.split('')).map((ch, i) => ({ch, id:i, used:false}));
  g.locked = false;
  renderSort(root);
  setTimeout(() => speak(g.word.en), 280);
}
function renderSort(root){
  const g = sortGame;
  root.innerHTML = `
    <div class="card">
      <h2>🔤 字母排序</h2>
      <div class="sub">听单词，把打乱的字母按顺序点回来（中文：<b>${g.word.zh}</b>）。范围：${scopeLabel()}。</div>
      <div class="prompt"><div class="big">${g.word.emoji}</div><div class="q">${g.word.zh}</div></div>
      <div class="center" style="margin-bottom:12px">
        <button class="btn ghost sm" id="again">🔊 再听一次</button>
      </div>
      <div class="blanks">${g.slot.map(ch => `<div class="blank ${ch ? '' : 'on'}">${ch}</div>`).join('')}</div>
      <div class="tiles" id="tiles">
        ${g.tiles.map(t => `<button class="tile ${t.used ? 'gone' : ''}" data-id="${t.id}">${t.ch}</button>`).join('')}
      </div>
      <div class="row" style="justify-content:center;margin-top:12px">
        <button class="btn sm ghost" id="undo">← 退一格</button>
      </div>
    </div>`;
  root.querySelector('#again').addEventListener('click', () => speak(g.word.en));
  root.querySelector('#undo').addEventListener('click', () => {
    if(g.locked) return;
    const last = g.slot.lastIndexOf('');       /* 找最后一个已填位置 */
    let pos = -1;
    for(let i = g.slot.length - 1; i >= 0; i--){ if(g.slot[i]){ pos = i; break; } }
    if(pos < 0) return;
    const ch = g.slot[pos];
    const t = g.tiles.filter(x => x.used && x.ch === ch).pop();
    if(t) t.used = false;
    g.slot[pos] = '';
    renderSort(root);
  });
  root.querySelectorAll('#tiles .tile').forEach(b =>
    b.addEventListener('click', () => tapSort(root, Number(b.dataset.id))));
}
function tapSort(root, id){
  const g = sortGame;
  if(g.locked) return;
  const t = g.tiles.find(x => x.id === id);
  if(!t || t.used) return;
  const pos = g.slot.indexOf('');
  if(pos < 0) return;
  t.used = true;
  g.slot[pos] = t.ch;
  sfxRight();
  if(g.slot.indexOf('') < 0){
    g.locked = true;
    record(g.word.id, g.word.en, true);
    const ended = award(true);
    toast('🎉 ' + g.word.en); speak(g.word.en);
    if(ended) return;
    setTimeout(() => newSortRound(root), 1300);
    return;
  }
  renderSort(root);
}

function paintList(root){
  const tw = root.querySelector('#tw');
  const sw = root.querySelector('#sw');
  tw.innerHTML = ''; sw.innerHTML = '';
  const q = listQuery.trim().toLowerCase();

  let shownWords = 0;
  const mods = modulesInScope();
  let lastLvl = 0;
  mods.forEach(n => {
    const info = modInfo(n);
    const lvl = lvlOf(n);
    const list = WORDS.filter(w => w.m === n && (!q || matchQuery(w.en) || matchQuery(w.zh) || matchQuery('m'+n)));
    if(!list.length) return;
    if(lvl !== lastLvl){
      lastLvl = lvl;
      const L = LEVELS.find(x => x.k === lvl);
      const h = document.createElement('div');
      h.className = 'lvhdr';
      h.textContent = `L${L.k} ${L.emoji} ${L.name}（${L.range}）`;
      tw.appendChild(h);
    }
    const g = document.createElement('div');
    g.innerHTML = `<div class="grp">M${n} ${info.title}<span class="n">${list.length} 词</span></div>`;
    list.forEach(w => g.appendChild(wordRow(w)));
    tw.appendChild(g);
    shownWords += list.length;
  });
  if(!shownWords){
    tw.innerHTML = `<div class="empty-hint">${mods.length ? '没有匹配的单词' : '这个范围还没有内容'}</div>`;
  }

  const sl = SENTENCES.filter(s => modulesInScope().includes(s.m) &&
    (!q || matchQuery(s.en) || matchQuery(s.zh) || matchQuery('m'+s.m)));
  sl.forEach(s => {
    const d = document.createElement('div');
    d.className = 'wrow';
    d.innerHTML = `<span class="en" style="min-width:auto;flex:1">${s.en}</span>
      <span class="zh">${s.zh}</span>
      <span class="tag ${s.book?'book':'draft'}">${s.book?'已核对':'待核对'}</span>
      <button class="say">🔊</button>`;
    d.querySelector('.say').addEventListener('click', () => speak(s.en));
    sw.appendChild(d);
  });
  if(!sl.length) sw.innerHTML = '<div class="empty-hint">没有匹配的句型</div>';
}

function wordRow(w){
  const d = document.createElement('div');
  d.className = 'wrow';
  d.innerHTML = `<span class="e"${w.emoji.length > 3 ? ' style="font-size:12px"' : w.emoji.length > 2 ? ' style="font-size:16px"' : ''}>${w.emoji}</span>
    <span class="en">${w.en}</span>
    <span class="zh">${w.zh}</span>
    <span class="tag ${w.book?'book':'draft'}">${w.book?'已核对':'待核对'}</span>
    <button class="say">🔊</button>`;
  d.querySelector('.say').addEventListener('click', () => speak(w.en));
  return d;
}

/* =========================================================
   首页
   ========================================================= */
function mountHome(root){
  const entries = Object.entries(S.log);
  const weak = entries.filter(([,v]) => v.wrong > 0).sort((a,b) => b[1].wrong - a[1].wrong).slice(0, 10);
  const draft = WORDS.filter(w => !w.book).length;
  const cur = currentModule(), cp = progressOf(cur);
  const done = clearedCount(), openWords = unlockedWordCount();
  const riding = RIDE_BY_N[S.ride] || null;
  const sNext = nextStageIn(cur) || STAGES_PER_MOD;
  const gNext = stageGame(cur, sNext);

  root.innerHTML = `
    <div class="card">
      <h2>🏠 英语游戏实验室 v5</h2>

        闯关赚 🪙 金币，通关一个模块就能把它那辆专属交通工具换回家（共 ${RIDES.length} 辆）。
      </div>
      <div class="coinrow" style="margin:12px 0 14px">
        <div class="coinbox">金币<b>🪙 ${S.coins}</b></div>
        <div class="coinbox">星星<b>⭐ ${allStars()}</b></div>
        <div class="coinbox">车库<b>🚗 ${ownedCount()}/${RIDES.length}</b></div>
      </div>
      <div class="row">
        <button class="btn" data-go="map">🗺️ 继续闯关：M${cur} 第 ${sNext} 关</button>
        <button class="btn ghost" data-go="garage">🚗 去车库</button>
        <button class="btn ghost" data-go="list">🔤 单词表</button>
      </div>
      <div class="sub" style="margin:12px 0 0">
        ${riding ? `🚗 当前座驾：<b>${riding.name}</b>（换车去车库点一下就行）` : '🚗 还没有座驾 —— 通关一个模块后去车库换一辆吧'}
      </div>
    </div>

    <div class="card">
      <h2>🗺️ 闯关进度</h2>
      <div class="sub">
        ${S.free ? '🔓 <b>家长模式已开启</b>：全部模块和单词都已解锁。' :
          `每个模块 <b>${STAGES_PER_MOD}</b> 个关卡，一关一种玩法，一关一关往前打。
           ${STAGES_PER_MOD} 关全过就解锁下一模块，以及本模块那辆专属交通工具。`}
      </div>
      <div class="pbar"><i style="width:${S.free ? 100 : done}%"></i></div>
      <div class="log">
        <div class="l"><span class="en">已通关模块</span><span>
          <span class="badge">${done} / ${MODULES.length}</span>
          ${done === MODULES.length ? '<span class="badge">🏆 全通关</span>' : ''}</span></div>
        <div class="l"><span class="en">当前模块</span><span>
          <span class="badge">M${cur} ${modInfo(cur).title}</span>
          <span class="badge warn">${cp.got} / ${cp.total} 关</span></span></div>
        <div class="l"><span class="en">下一关</span><span>
          <span class="badge">第 ${sNext} 关 ${gNext.ic} ${gNext.name}</span>
          <span class="badge">⭐ ${moduleStars(cur)} / ${STAGES_PER_MOD * 3}</span></span></div>
        <div class="l"><span class="en">金币 / 座驾</span><span>
          <span class="badge">🪙 ${S.coins}</span>
          <span class="badge">🚗 ${ownedCount()} / ${RIDES.length} 辆</span></span></div>
        <div class="l"><span class="en">已解锁词汇</span><span>
          <span class="badge">${openWords} 词</span>
          <span class="badge warn">🔒 还有 ${WORDS.length - openWords} 词</span></span></div>
        <div class="l"><span class="en">已解锁模块</span><span>
          <span class="badge">M1 – M${maxUnlocked()}</span></span></div>
        <div class="l"><span class="en">累计答对</span><span>
          <span class="badge">${S.stars} 次</span>
          <span class="badge">共 ${Object.keys(S.log).length} 个词/句练过</span></span></div>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn" data-go-cur="1">▶️ 继续闯关：M${cur} 第 ${sNext} 关</button>
        <button class="btn sm ghost" data-go-cur-list="1">🔤 看这一关的单词</button>
      </div>
    </div>

    <div class="card">
      <h2>📚 词库构成（5 级 × 20 模块）</h2>
      <div class="log">
        ${LEVELS.map(L => {
          const w = levelWords(L.k), s = levelSentences(L.k);
          const bk = WORDS.filter(x => lvlOf(x.m) === L.k && x.book).length;
          const open = levelUnlocked(L.k);
          const cdone = MODULES.filter(m => lvlOf(m.n) === L.k && isCleared(m.n)).length;
          return `<div class="l">
            <span class="en">${open ? (cdone === MODS_PER_LEVEL ? '✅' : L.emoji) : '🔒'} L${L.k} ${L.name} <span style="font-weight:400;color:#9A8A9A">${L.range}</span></span>
            <span>
              ${open ? `<span class="badge">${cdone}/20 模块</span>` : '<span class="badge warn">未解锁</span>'}
              <span class="badge">${w} 词</span>
              <span class="badge">${s} 句</span>
              ${bk ? `<span class="badge">已核对 ${bk}</span>` : ''}
            </span>
          </div>`;
        }).join('')}
        <div class="l">
          <span class="en">合计</span>
          <span><span class="badge">${WORDS.length} 词</span><span class="badge">${SENTENCES.length} 句</span>
          <span class="badge warn">待核对 ${draft} 词</span></span>
        </div>
      </div>
      <div class="row" style="margin-top:12px">
        ${LEVELS.map(L => {
          const open = levelUnlocked(L.k);
          return `<button class="btn sm ghost" data-lvl="${L.k}">${open ? '' : '🔒 '}L${L.k} ${L.name}</button>`;
        }).join('')}
      </div>
    </div>

    <div class="card">
      <h2>📋 本轮练习</h2>
      <div class="sub">当前范围 <b>${scopeLabel()}</b>：${poolWords().length} 词 / ${poolSentences().length} 句。</div>
      <div class="log">
        ${entries.length ? entries.slice().reverse().slice(0,14).map(([id,v]) => `
          <div class="l"><span class="en">${v.label}</span><span>
            <span class="badge ${v.wrong?'warn':''}">对 ${v.right}</span>
            ${v.wrong ? `<span class="badge warn">错 ${v.wrong}</span>` : ''}
          </span></div>`).join('') : '<div class="l"><span>还没开始玩～</span></div>'}
      </div>
    </div>

    <div class="card">
      <h2>🎯 明天优先复习</h2>
      <div class="sub">按错误次数排序，可直接喂给 src/mastery.js 的 needs-help 队列。</div>
      <div class="log">
        ${weak.length ? weak.map(([id,v]) => `
          <div class="l"><span class="en">${v.label}</span><span class="badge warn">错 ${v.wrong} 次</span></div>`).join('')
        : '<div class="l"><span>目前没有薄弱的，继续保持 ✨</span></div>'}
      </div>
      ${weak.length ? '<div class="row" style="margin-top:12px"><button class="btn sm" data-go-weak="1">⚠️ 只练这些</button></div>' : ''}
    </div>

    <div class="card center">
      <div class="sub" style="margin-bottom:10px">家长设置</div>
      <div class="row" style="justify-content:center">
        <button class="btn sm ghost" id="free">${S.free ? '🔒 回到闯关模式' : '🔓 家长模式：解锁全部'}</button>
        <button class="btn sm ghost" id="reset">清空实验室数据</button>
      </div>
      <div class="sub" style="margin:10px 0 0">
        孩子卡住、或要临时查后面模块的内容时用「家长模式」；关掉就回到闯关进度。
      </div>
    </div>`;

  root.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
  root.querySelectorAll('[data-lvl]').forEach(b => b.addEventListener('click', () => {
    const k = Number(b.dataset.lvl);
    if(!levelUnlocked(k)){ toast(`L${k} 还没解锁，先闯前面的关吧～`); return; }
    setScope('L'+k); go('list');
  }));
  const wb = root.querySelector('[data-go-weak]');
  if(wb) wb.addEventListener('click', () => { setScope('weak'); startFreePlay('find', currentModule()); });
  const cb = root.querySelector('[data-go-cur]');
  if(cb) cb.addEventListener('click', () => { setScope('m' + currentModule()); go('map'); });
  const cl = root.querySelector('[data-go-cur-list]');
  if(cl) cl.addEventListener('click', () => { setScope('m' + currentModule()); go('list'); });
  root.querySelector('#free').addEventListener('click', () => {
    if(!S.free && !confirm('解锁全部 100 个模块？孩子就能随便跳到任意关卡和单词了。')) return;
    S.free = !S.free;
    /* 从家长模式回到闯关：如果当前范围已被锁住，退回「全部已解锁」 */
    if(!S.free && ((scope[0] === 'm' && !isUnlocked(Number(scope.slice(1)))) ||
                   (scope[0] === 'L' && !levelUnlocked(Number(scope.slice(1)))))){
      scope = 'all'; S.scope = 'all';
    }
    save(); paintChips(); paintTop(); mountHome(root);
    toast(S.free ? '已解锁全部模块' : '已回到闯关模式');
  });
  root.querySelector('#reset').addEventListener('click', () => {
    if(!confirm('清空实验室数据？星星、金币、车库、练习记录和闯关进度都会归零，从 M1 重新开始。')) return;
    try{ localStorage.removeItem(KEY); }catch(e){}
    const mask = document.getElementById('mask');
    if(mask) mask.remove();
    S = load(); scope = 'm1'; levelView = 1; SES = null; garageFilter = 'all';
    paintSession(); paintChips(); paintTop(); mountHome(root);
  });
}

/* =========================================================
   范围选择器（两级）
   ========================================================= */
function paintChips(){
  /* 第一排：全部已解锁 + 5 个级别 + 只练错过的 */
  const lvBox = $('#lvChips');
  lvBox.innerHTML = '';
  lvBox.appendChild(mkChip('all', `全部已解锁<i>${unlockedWordCount()}</i>`, scope === 'all', () => setScope('all')));
  LEVELS.forEach(L => {
    const open = levelUnlocked(L.k);
    const done = MODULES.filter(m => lvlOf(m.n) === L.k && isCleared(m.n)).length;
    const icon = !open ? '🔒' : done === MODS_PER_LEVEL ? '✅' : L.emoji;
    const b = mkChip('L'+L.k,
      `${icon} L${L.k} ${L.name}<i>${open ? levelWords(L.k) : 0}</i>`,
      scope === 'L'+L.k, () => setScope('L'+L.k));
    if(!open) b.classList.add('lock');
    lvBox.appendChild(b);
  });
  lvBox.appendChild(mkChip('weak', `⚠️ 只练错过的<i>${weakCount()}</i>`, scope === 'weak', () => setScope('weak')));

  /* 第二排：当前浏览级别的 20 个模块 */
  const modBox = $('#modChips');
  modBox.innerHTML = '';
  const L = LEVELS.find(x => x.k === levelView);
  modBox.appendChild(mkChip('L'+L.k, `本级全部<i>${levelWords(L.k)}</i>`,
    scope === 'L'+L.k, () => setScope('L'+L.k), true));
  const now = currentModule();
  MODULES.filter(m => lvlOf(m.n) === levelView).forEach(m => {
    const open = isUnlocked(m.n), done = isCleared(m.n);
    const icon = !open ? '🔒 ' : done ? '✅ ' : (m.n === now ? '👉 ' : '');
    const tail = open ? `<i>${stagesDoneIn(m.n)}/${STAGES_PER_MOD}关</i>` : '';
    const b = mkChip('m'+m.n, `${icon}<b>M${m.n}</b>${m.title}${tail}`,
      scope === 'm'+m.n, () => setScope('m'+m.n), true);
    if(!open) b.classList.add('lock');
    modBox.appendChild(b);
  });
}
function mkChip(key, html, on, onClick, mini){
  const b = document.createElement('button');
  b.className = 'schip' + (mini ? ' mini' : '') + (on ? ' on' : '');
  b.dataset.k = key;
  b.innerHTML = html;
  b.addEventListener('click', onClick);
  return b;
}
function setScope(k){
  /* 闯关门控：锁住的模块 / 级别点不动 */
  if(k[0] === 'm'){
    const n = Number(k.slice(1));
    if(!isUnlocked(n)){ toast(`先通关 M${n - 1}，才能解锁这一关哦～`); return; }
  }else if(k[0] === 'L' && !levelUnlocked(Number(k.slice(1)))){
    toast('这一级还没解锁，先闯前面的关吧～'); return;
  }
  scope = k; S.scope = k; save();
  if(k[0] === 'L') levelView = Number(k.slice(1));
  else if(k[0] === 'm') levelView = lvlOf(Number(k.slice(1)));
  paintChips(); paintTop();
  const cur = document.querySelector('.tab.on');
  if(cur && cur.dataset.g === 'list') mountList($('#stage'));
}
function restoreScope(){
  const ok = k => k === 'all' || k === 'weak' || /^L[1-5]$/.test(k) || /^m([1-9]|[1-9][0-9]|100)$/.test(k);
  /* 第一次进来默认就落在当前关卡上，孩子一点开游戏就是这一关的题 */
  let s = ok(S.scope) ? S.scope : 'm' + currentModule();
  /* 存档里的范围可能已经被锁（比如中途上锁 / 家长模式关掉）→ 退回「全部已解锁」 */
  if(s[0] === 'm' && !isUnlocked(Number(s.slice(1)))) s = 'all';
  if(s[0] === 'L' && !levelUnlocked(Number(s.slice(1)))) s = 'all';
  /* 上次停在已经通关的模块上 → 自动前进到当前关卡，保持闯关节奏 */
  if(!S.free && s[0] === 'm' && isCleared(Number(s.slice(1)))) s = 'm' + currentModule();
  scope = s; S.scope = s;
  levelView = scope[0] === 'L' ? Number(scope.slice(1))
             : scope[0] === 'm' ? lvlOf(Number(scope.slice(1))) : currentLevelView();
}
/* 默认显示当前关卡所在级别，孩子一进来就看到自己那一关 */
function currentLevelView(){ return lvlOf(currentModule()); }

/* =========================================================
   路由
   ========================================================= */
function go(name){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.g === name));
  const root = $('#stage');
  ac();                                  /* 任何导航手势都用来解锁音频 */
  if(name !== 'play') SES = null;        /* 离开游戏页 = 本次关卡会话结束 */
  paintSession();                        /* 顺便把顶部关卡条清掉 */
  if(name === 'home') mountHome(root);
  else if(name === 'map') mountMap(root);
  else if(name === 'garage') mountGarage(root);
  else if(name === 'list') mountList(root);
  else if(name === 'play') mountSession();
  window.scrollTo({top:0,behavior:'smooth'});
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => go(t.dataset.g)));

restoreScope();
paintChips();
paintTop();
go('home');

/* ---------- PWA：离线可玩 + 可安装到主屏 ---------- */
/* 只在 http(s) 下注册；用 file:// 直接双击打开时安静跳过 */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
  /* 有新版本就提示一次（不打断游戏） */
  navigator.serviceWorker.addEventListener('message', e => {
    if(e.data && e.data.type === 'updated'){
      try{ toast('有新版本啦，关掉重开就会加载 ✨'); }catch(_){}
    }
  });
}
/* iOS 加到主屏后从主屏启动时，隐藏浏览器态的滚动回弹 */
document.addEventListener('touchmove', e => {
  if(e.touches.length > 1) e.preventDefault();
}, {passive:false});
</script>
